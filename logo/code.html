<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="softAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#4338CA" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="720" height="900" fill="url(#bgGrad)"/>

  <!-- Architectural Background Grid Lines -->
  <g opacity="0.4" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 6">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="560" y1="0" x2="560" y2="900"/>
    <line x1="0" y1="180" x2="720" y2="180"/>
    <line x1="0" y1="360" x2="720" y2="360"/>
    <line x1="0" y1="540" x2="720" y2="540"/>
    <line x1="0" y1="720" x2="720" y2="720"/>
  </g>

  <!-- Large Architectural Circles and Arcs -->
  <circle cx="360" cy="450" r="260" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="360" cy="450" r="190" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="360" cy="450" r="120" fill="#EEF2FF" opacity="0.6"/>

  <!-- Geometric Abstract composition layers -->
  <g filter="url(#subtleGlow)">
    <!-- Main rotated diamond/square -->
    <rect x="235" y="325" width="250" height="250" rx="40" transform="rotate(45 360 450)" fill="url(#cardGrad)" stroke="#E0E7FF" stroke-width="2"/>
    <!-- Deep indigo primary accent core -->
    <rect x="290" y="380" width="140" height="140" rx="28" transform="rotate(45 360 450)" fill="url(#indigoGrad)"/>
    <!-- Overlapping translucent glass pill -->
    <rect x="260" y="270" width="200" height="90" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Secondary glass pill -->
    <rect x="260" y="540" width="200" height="90" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Modern UI Mockup Elements inside Geometric Structure -->
  <!-- Top Floating Card Indicators -->
  <circle cx="295" cy="315" r="14" fill="#4338CA"/>
  <path d="M291 315L294 318L300 312" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="325" y="307" width="105" height="7" rx="3.5" fill="#0F172A" opacity="0.8"/>
  <rect x="325" y="318" width="65" height="6" rx="3.5" fill="#94A3B8"/>

  <!-- Center Floating Icon / Shield Security -->
  <path d="M360 432L378 440V454C378 465 370 475 360 478C350 475 342 465 342 454V440L360 432Z" fill="white" opacity="0.95"/>
  <path d="M356 455L359 458L365 452" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Floating Card Indicators -->
  <rect x="290" y="575" width="30" height="20" rx="6" fill="#EEF2FF"/>
  <path d="M299 585H311M299 581H307" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <rect x="332" y="575" width="100" height="7" rx="3.5" fill="#0F172A" opacity="0.8"/>
  <rect x="332" y="587" width="75" height="6" rx="3.5" fill="#94A3B8"/>

  <!-- Orbiting Nodes and Accent Details -->
  <circle cx="160" cy="270" r="6" fill="#4F46E5"/>
  <circle cx="560" cy="630" r="8" fill="#6366F1" opacity="0.6"/>
  <circle cx="530" cy="230" r="12" fill="#E0E7FF"/>
  <circle cx="190" cy="670" r="10" fill="#C7D2FE" opacity="0.8"/>

  <!-- Precision Corner Crosshairs -->
  <path d="M70 70V90M70 70H90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M650 70V90M650 70H630" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 830V810M70 830H90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M650 830V810M650 830H630" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
</svg>
